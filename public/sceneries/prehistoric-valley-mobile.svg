  <style>
    .pvSmoke { animation: pvSmokeRise 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pvSmoke2 { animation-delay: -3s; }
    .pvSmoke3 { animation-delay: -6s; }
    .pvGlow { animation: pvGlowPulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pvFalls { animation: pvFallsFlow 1.6s linear infinite; }
    .pvPtero { animation: pvPteroGlide 16s ease-in-out infinite; }
    @keyframes pvSmokeRise {
      0% { opacity: 0; transform: translate(0, 14px) scale(0.7); }
      20% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(var(--pv-smoke-x, -40px), -54px) scale(1.3); }
    }
    @keyframes pvGlowPulse {
      0%, 100% { opacity: 0.6; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes pvFallsFlow {
      from { transform: translateY(0); }
      to { transform: translateY(44px); }
    }
    @keyframes pvPteroGlide {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-60px, 10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pvSmoke, .pvGlow, .pvFalls, .pvPtero { animation: none; }
    }
  </style>
