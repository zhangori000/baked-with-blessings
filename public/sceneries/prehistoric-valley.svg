<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 600" role="img" aria-label="Prehistoric valley with a smoking volcano">
  <title>Prehistoric valley</title>
  <desc>A sunny prehistoric valley with a gently smoking volcano, a waterfall cliff, a lake, palm trees, tree ferns and distant long-necked dinosaurs.</desc>
