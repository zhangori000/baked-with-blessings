<svg width="92" height="112" viewBox="0 0 92 112" xmlns="http://www.w3.org/2000/svg"><style>.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.capeScarf,.familiar,.spark{transform-box:view-box}.body,.robe{transform-origin:48px 91px;animation:benderCastBody 1.28s ease-in-out infinite}.head{transform-origin:48px 31px;animation:benderCastHead 1.28s ease-in-out infinite}.hatHair{transform-origin:48px 19px;animation:benderCastBraid 1.28s ease-in-out infinite}.staffArm{transform-origin:63px 54px;animation:benderCastNearArm 1.28s ease-in-out infinite}.offArm{transform-origin:33px 54px;animation:benderCastFarArm 1.28s ease-in-out infinite}.capeScarf{transform-origin:47px 58px;animation:benderCastSash 1.28s ease-in-out infinite}.robeHem{transform-origin:48px 73px;animation:benderCastHem 1.28s ease-in-out infinite}.familiar{transform-origin:52px 93px;animation:benderCastLegs 1.28s ease-in-out infinite}.spark{transform-origin:49px 65px;animation:benderCastFlow 1.28s ease-in-out infinite}@keyframes benderCastBody{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(10px) scale(1.18,.78)}48%{transform:translateX(-5px) rotate(-12deg) scale(.98,1.04)}72%{transform:translateX(8px) translateY(-5px) rotate(14deg) scale(.92,1.08)}}@keyframes benderCastHead{0%,100%{transform:rotate(0)}20%{transform:translateY(8px) rotate(-7deg)}48%{transform:translateX(-4px) rotate(-18deg)}72%{transform:translateX(8px) translateY(-4px) rotate(18deg)}}@keyframes benderCastBraid{0%,100%{transform:rotate(0)}20%{transform:translateY(7px) rotate(-8deg)}48%{transform:translateX(8px) rotate(28deg)}72%{transform:translateX(-10px) rotate(-34deg)}}@keyframes benderCastNearArm{0%,100%{transform:rotate(0)}20%{transform:translate(-9px,10px) rotate(54deg)}48%{transform:translate(-18px,-5px) rotate(-70deg)}72%{transform:translate(14px,-11px) rotate(74deg)}}@keyframes benderCastFarArm{0%,100%{transform:rotate(0)}20%{transform:translate(9px,10px) rotate(-56deg)}48%{transform:translate(18px,-5px) rotate(66deg)}72%{transform:translate(-12px,-8px) rotate(-84deg)}}@keyframes benderCastSash{0%,100%{transform:skewX(0)}20%{transform:skewX(-18deg) scaleX(1.16)}48%{transform:skewX(24deg) translateX(6px)}72%{transform:skewX(-30deg) translateX(-9px)}}@keyframes benderCastHem{0%,100%{transform:scaleX(1)}20%{transform:scaleX(1.28)}48%{transform:skewX(-16deg)}72%{transform:skewX(22deg) scaleX(1.12)}}@keyframes benderCastLegs{0%,100%{transform:translateY(0)}20%{transform:translateY(5px) scaleX(1.18)}48%{transform:translateX(-5px) rotate(-7deg)}72%{transform:translateX(9px) rotate(13deg)}}@keyframes benderCastFlow{0%,100%{opacity:.35;transform:scale(.75) rotate(0)}20%{opacity:.7;transform:translateY(5px) scale(1.05,.65)}48%{opacity:.95;transform:translateX(-10px) rotate(-100deg) scale(1.1)}72%{opacity:1;transform:translateX(13px) rotate(95deg) scale(1.25)}}@media (prefers-reduced-motion: reduce){.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.capeScarf,.familiar,.spark{animation:none}}</style><ellipse cx="48" cy="106" rx="30" ry="6" fill="#000" opacity="0.12"/><g class="spark"><path d="M19 75C30 63 43 58 57 60C69 62 77 71 80 81" stroke="#6fb6b7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.68"/><path d="M18 84C34 80 45 72 55 60C61 50 69 46 80 44" stroke="#f35b2c" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.72"/><path d="M30 91C40 82 53 80 67 85" stroke="#c28a35" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.66"/><path d="M26 59C40 52 54 50 70 54" stroke="#d8f4ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/></g><g class="familiar"><path d="M26 92L39 92L38 101C32 105 24 104 19 100C20 96 22 94 26 92Z" fill="#5c4033"/><path d="M59 91L72 91C77 94 80 98 80 102C72 105 63 105 57 100Z" fill="#5c4033"/><path d="M25 83L39 92M61 84L72 92" stroke="#d7b28b" stroke-width="3.2" stroke-linecap="round"/><path d="M28 88H38M62 88H71" stroke="#fff0d0" stroke-width="2.2" stroke-linecap="round"/></g><g class="offArm