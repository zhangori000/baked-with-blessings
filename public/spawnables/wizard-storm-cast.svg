<svg width="92" height="112" viewBox="0 0 92 112" xmlns="http://www.w3.org/2000/svg"><style>.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{transform-box:view-box}.body,.robe{transform-origin:47px 101px;animation:stormBody 1.05s ease-in-out infinite}.head{transform-origin:46px 38px;animation:stormHead 1.05s ease-in-out infinite}.hatHair{transform-origin:46px 21px;animation:stormHair 1.05s ease-in-out infinite}.staffArm,.staff{transform-origin:61px 61px;animation:stormStaff 1.05s ease-in-out infinite}.offArm{transform-origin:33px 61px;animation:stormOff 1.05s ease-in-out infinite}.capeScarf{transform-origin:39px 54px;animation:stormScarf 1.05s ease-in-out infinite}.robeHem{transform-origin:46px 96px;animation:stormHem 1.05s ease-in-out infinite}.familiar{transform-origin:76px 31px;animation:stormKite 1.05s ease-in-out infinite}.spark{transform-origin:66px 27px;animation:stormBolt 1.05s steps(2,end) infinite}@keyframes stormBody{0%,100%{transform:rotate(-12deg) translateX(-3px)}24%{transform:translateX(-8px) rotate(-29deg)}52%{transform:translate(8px,-7px) rotate(19deg)}78%{transform:translateX(-4px) rotate(-5deg)}}@keyframes stormHead{0%,100%{transform:rotate(-8deg)}24%{transform:rotate(-24deg) translateX(-3px)}52%{transform:rotate(18deg) translateY(-3px)}78%{transform:rotate(7deg)}}@keyframes stormHair{0%,100%{transform:scale(1) rotate(-5deg)}24%{transform:scale(1.12) rotate(-18deg)}52%{transform:scale(1.28) rotate(16deg)}78%{transform:scale(1.06) rotate(-5deg)}}@keyframes stormStaff{0%,100%{transform:rotate(-18deg)}24%{transform:translate(-15px,4px) rotate(-78deg)}52%{transform:translate(8px,-15px) rotate(62deg)}78%{transform:rotate(12deg)}}@keyframes stormOff{0%,100%{transform:rotate(7deg)}24%{transform:translate(-8px,4px) rotate(42deg)}52%{transform:translate(10px,-9px) rotate(-58deg)}78%{transform:rotate(8deg)}}@keyframes stormScarf{0%,100%{transform:skewX(-18deg) translateX(-5px)}24%{transform:skewX(-36deg) translateX(-13px)}52%{transform:skewX(27deg) translateX(13px)}78%{transform:skewX(-12deg) translateX(-3px)}}@keyframes stormHem{0%,100%{transform:skewX(-4deg)}52%{transform:skewX(14deg) scaleX(1.2)}}@keyframes stormKite{0%,100%{transform:translateY(0) rotate(-8deg)}24%{transform:translate(-8px,-5px) rotate(-28deg)}52%{transform:translate(8px,-12px) rotate(24deg)}78%{transform:translateY(-2px) rotate(4deg)}}@keyframes stormBolt{0%,100%{opacity:.25;transform:scale(.65)}52%{opacity:1;transform:scale(1.3)}}@media (prefers-reduced-motion: reduce){.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{animation:none}}</style><ellipse cx="46" cy="106" rx="28" ry="5.5" fill="#000000" opacity="0.12"/><g class="familiar"><path d="M69 25L83 15L89 32L75 40Z" fill="#d8f4ff"/><path d="M74 26L85 31M82 18L76 37" stroke="#aa84da" stroke-width="2" stroke-linecap="round"/><path d="M75 40C70 49 72 56 76 63" stroke="#8b6a2c" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="capeScarf"><path d="M32 50C19 44 10 47 5 56C15 62 29 61 39 54Z" fill="#d85c61"/><path d="M37 55C25 61 17 68 13 78C27 78 39 69 45 58Z" fill="#b44752"/></g><g class="staffArm staff"><path d="M59 59C70 53 81 56 89 66C84 75 69 73 59 65Z" fill="#7d5a42"/><path d="M70 32L82 91" stroke="#6d5c47" stroke-width="4" stroke-linecap="round"/><path d="M64 31H79L74 20H68Z" fill="#e8eef8"/><path d="M68 20L71 8L75 20" fill="#ffd966"/><circle cx="60" cy="61" r="4" fill="#9b704e"/></g><g class="offArm"><path d="M35 62C25 60 17 67 12 78C20 83 33 75 41 66Z" fill="#7d5a42"/><circle cx="17" cy="78" r="4" fill="#9b704e"/></g><g class="body robe"><path d="M34 50C39 38 54 39 60 51C65 70 58 96 48 105C35 101 27 75 34 50Z" fill="#5c5aa8"/><path d="M47 42C57 58 57 82 52 100C57 92 60 72 58 54C55 46 51 42 47 42Z" fill="#403e88" opacity="0.72"/><path d="M36 62L51 55L46 70L59 65L43 88" stroke="#ffd966" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.82"/><g class="robeHem"><path d="M33 96C39 101 56 102 62 94C58 102 52 107 47 107C40 106 36 102 33 96Z" fill="#aa84da" opacity="0.72"/></g></g><path d="M38 96Q31 101 22 102" stroke="#4b2e2a" stroke-width="5.5" stroke-linecap="round" fill="none"/><path d="M51 98Q61 101 73 97" stroke="#4b2e2a" stroke-width="5.5" stroke-linecap="round" fill="none"/><g class="head"><circle cx="46" cy="40" r="13" fill="#8f5f45"/><path d="M34 39H58" stroke="#4d3f47" stroke-width="3.2" stroke-linecap="round"/><circle cx="40" cy="40" r="4.1" fill="#d8f4ff" opacity="0.75"/><circle cx="53" cy="40" r="4.1" fill="#d8f4ff" opacity="0.75"/><circle cx="40" cy="40" r="1.4" fill="#242234"/><circle cx="53" cy="40" r="1.4" fill="#242234"/><path d="M37 34C41 32 44 33 46 36M50 36C53 32 57 33 60 35" stroke="#34252b" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M43 48C47 45 52 46 56 50" stroke="#5e3329" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="hatHair"><path d="M34 33L30 18L40 27L42 12L48 27L57 13L56 29L65 23L60 35C52 31 43 30 34 33Z" fill="#2d2839"/><path d="M38 30L42 19L47 31L55 19L53 33" stroke="#ffd966" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/></g><g class="spark"><path d="M64 37L72 24L69 37L78 37L67 54L70 41Z" fill="#ffd966"/><path d="M80 47L85 39L83 48L89 48L81 60L83 51Z" fill="#d8f4ff" opacity="0.85"/></g></svg>
