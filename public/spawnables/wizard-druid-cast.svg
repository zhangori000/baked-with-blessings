<svg width="92" height="112" viewBox="0 0 92 112" xmlns="http://www.w3.org/2000/svg"><style>.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{transform-box:view-box}.body,.robe{transform-origin:45px 104px;animation:druidBody 1.32s ease-in-out infinite}.head{transform-origin:44px 45px;animation:druidHead 1.32s ease-in-out infinite}.hatHair{transform-origin:43px 32px;animation:druidHat 1.32s ease-in-out infinite}.staffArm,.staff{transform-origin:63px 62px;animation:druidStaff 1.32s ease-in-out infinite}.offArm{transform-origin:28px 66px;animation:druidOff 1.32s ease-in-out infinite}.capeScarf{transform-origin:45px 72px;animation:druidApron 1.32s ease-in-out infinite}.robeHem{transform-origin:45px 96px;animation:druidHem 1.32s ease-in-out infinite}.familiar{transform-origin:22px 45px;animation:druidFriend 1.32s ease-in-out infinite}.spark{transform-origin:39px 93px;animation:druidSprout 1.32s ease-in-out infinite}@keyframes druidBody{0%,100%{transform:translateY(0) rotate(-5deg)}24%{transform:translateY(13px) rotate(-12deg) scale(1.14,.76)}52%{transform:translateY(-6px) rotate(5deg) scale(.94,1.1)}78%{transform:translateY(2px) rotate(-2deg)}}@keyframes druidHead{0%,100%{transform:rotate(-3deg)}24%{transform:translateY(10px) rotate(-16deg)}52%{transform:translateY(-5px) rotate(9deg)}78%{transform:rotate(5deg)}}@keyframes druidHat{0%,100%{transform:rotate(-3deg)}24%{transform:translateY(8px) rotate(-18deg)}52%{transform:translateY(-6px) rotate(11deg)}78%{transform:rotate(5deg)}}@keyframes druidStaff{0%,100%{transform:rotate(0)}24%{transform:translate(-8px,11px) rotate(-18deg)}52%{transform:translate(8px,-12px) rotate(31deg)}78%{transform:rotate(-6deg)}}@keyframes druidOff{0%,100%{transform:rotate(0)}24%{transform:translate(-13px,14px) rotate(78deg)}52%{transform:translate(7px,-17px) rotate(-62deg)}78%{transform:translateY(4px) rotate(21deg)}}@keyframes druidApron{0%,100%{transform:scale(1)}24%{transform:scale(1.18,.72)}52%{transform:scale(.95,1.12)}78%{transform:skewX(4deg)}}@keyframes druidHem{0%,100%{transform:scaleX(1)}24%{transform:scaleX(1.28)}52%{transform:scaleX(.95)}}@keyframes druidFriend{0%,100%{transform:translateY(0) rotate(0)}24%{transform:translateY(7px) rotate(-10deg)}52%{transform:translateY(-7px) rotate(10deg)}78%{transform:translateY(0) rotate(4deg)}}@keyframes druidSprout{0%,100%{opacity:.2;transform:scale(.2,.1)}24%{opacity:.5;transform:translate(-10px,11px) scale(.45,.2)}52%{opacity:1;transform:translateY(-14px) scale(1.15)}78%{opacity:.7;transform:translateY(-5px) rotate(8deg)}}@media (prefers-reduced-motion: reduce){.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{animation:none}}</style><ellipse cx="46" cy="106" rx="28" ry="5.5" fill="#000000" opacity="0.12"/><g class="staffArm staff"><path d="M61 66C70 67 78 75 80 87C75 92 64 82 60 72Z" fill="#79a956"/><path d="M72 33C69 52 72 78 78 104" stroke="#6b4d36" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M72 38C81 33 86 25 86 17C77 19 70 26 69 36Z" fill="#78a64f"/><path d="M69 49C61 44 58 37 60 31C66 33 72 40 72 49Z" fill="#93bd60"/></g><g class="offArm"><path d="M34 67C24 71 17 82 16 93C24 96 35 85 39 72Z" fill="#79a956"/><circle cx="22" cy="91" r="4.5" fill="#c08a5a"/></g><g class="body robe"><path d="M18 65C24 48 61 47 71 65C77 82 66 100 47 105C25 102 12 84 18 65Z" fill="#6f9d58"/><path d="M48 49C61 61 63 84 57 99C54 102 50 104 47 105C51 82 51 64 48 49Z" fill="#4f7d44" opacity="0.64"/><g class="capeScarf"><path d="M27 68C36 77 57 77 65 67C65 82 60 96 47 104C33 96 28 82 27 68Z" fill="#d2b076"/><path d="M36 77H44M50 77H58M40 88H53" stroke="#8a6a42" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="79" r="1.6" fill="#3f6d3b"/><circle cx="55" cy="89" r="1.6" fill="#3f6d3b"/></g><g class="robeHem"><path d="M24 96C37 102 59 102 69 94C62 103 53 107 46 107C36 106 30 102 24 96Z" fill="#8fbd5f"/></g></g><path d="M36 99Q30 107 22 110" stroke="#5f4738" stroke-width="