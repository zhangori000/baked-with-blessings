      <circle cx="66" cy="45" r="2.3" fill="#202033" />
      <circle cx="89" cy="45" r="2.3" fill="#202033" />
      <path d="M68 56Q76 52 86 56" class="mouth" />
      <circle cx="61" cy="51" r="4" fill="#ee8f95" opacity=".52" />
