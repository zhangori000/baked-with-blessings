<svg width="156" height="160" viewBox="0 0 156 160" xmlns="http:&#47;&#47;www.w3.org/2000/svg">
  <defs>
    <style>
      .part,
      .rig {
        transform-box: view-box;
      }
      .torso {
        transform-origin: 78px 98px;
      }
      .head {
        transform-origin: 78px 43px;
      }
      .armL {
        transform-origin: 51px 72px;
      }
      .armR {
        transform-origin: 104px 72px;
      }
      .legL {
        transform-origin: 58px 102px;
      }
      .legR {
        transform-origin: 98px 102px;
      }
      .skin {
        fill: #efb184;
      }
      .skinDark {
        fill: #c77c58;
      }
      .shade {
        fill: #c77c58;
        opacity: 0.34;
      }
      .palm {
        fill: #f7c197;
      }
      .foot {
        fill: none;
        stroke: #7d4b35;
        stroke-width: 8;
        stroke-linecap: round;
      }
      .shadeLine {
        fill: none;
        stroke: #c77c58;
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 0.45;
      }
      .palmLines {
        fill: none;
        stroke: #c77c58;
        stroke-width: 2;
        stroke-linecap: round;
        opacity: 0.58;
      }
      .brows {
        fill: none;
        stroke: #4a2530;
        stroke-width: 4;
        stroke-linecap: round;
      }
      .mouth {
        fill: none;
        stroke: #8c3f2e;
        stroke-width: 3.4;
        stroke-linecap: round;
      }
      .proud {
        stroke-width: 3.8;
      }
      .mawashi {
        fill: #213a76;
      }
      .mawashiHi {
        fill: #4560ae;
      }
      .sagari {
        stroke: #fff1cf;
        stroke-width: 3.4;
        stroke-linecap: round;
      }
      .dust {
        transform-origin: 108px 138px;
        opacity: 0;
      }
      .rig {
        animation: shoveLoop 0.62s cubic-bezier(0.28, 0, 0.18, 1) infinite;
      }
      .armL,
      .armR {
        animation: shoveArms 0.62s ease-in-out infinite;
      }
      @keyframes shoveLoop {
        0% {
          transform: rotate(-18deg) translateX(-4px);
        }
        48% {
          transform: rotate(-30deg) translateX(22px) scale(1.08, 0.92);
        }
        100% {
          transform: rotate(-18deg) translateX(0);
        }
      }
      @keyframes shoveArms {
        0% {
          transform: translateX(0);
        }
        48% {
          transform: translateX(15px);
        }
        100% {
          transform: translateX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rig,
        .torso,
        .head,
        .armL,
        .armR,
        .legL,
        .legR,
        .dust {
          animation: none;
        }
      }
    </style>
