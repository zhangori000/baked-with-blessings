    <style>
      .koiA {
        animation: koiA 8.5s linear infinite;
      }
      .koiB {
        animation: koiB 10.5s linear infinite;
      }
      .koiC {
        animation: koiC 12s linear infinite;
      }
      .rip {
        animation: rip 3.4s ease-in-out infinite;
        transform-origin: center;
      }
      .koiA,
      .koiB,
      .koiC {
        transform-box: view-box;
        transform-origin: 110px 57px;
      }
      @keyframes koiA {
        0% {
          transform: rotate(0deg) translate(38px, 0) rotate(0deg);
        }
        50% {
          transform: rotate(180deg) translate(30px, 4px) rotate(-180deg);
        }
        100% {
          transform: rotate(360deg) translate(38px, 0) rotate(-360deg);
        }
      }
      @keyframes koiB {
        0% {
          transform: rotate(130deg) translate(34px, -2px) rotate(-130deg);
        }
        50% {
          transform: rotate(310deg) translate(28px, 3px) rotate(-310deg);
        }
        100% {
          transform: rotate(490deg) translate(34px, -2px) rotate(-490deg);
        }
      }
      @keyframes koiC {
        0% {
          transform: rotate(250deg) translate(28px, 2px) rotate(-250deg);
        }
        50% {
          transform: rotate(70deg) translate(36px, -3px) rotate(-70deg);
        }
        100% {
          transform: rotate(-110deg) translate(28px, 2px) rotate(110deg);
        }
      }
      @keyframes rip {
        0%,
        100% {
          opacity: 0.28;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.65;
          transform: scale(1.03);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .koiA,
        .koiB,
        .koiC,
        .rip {
          animation: none;
        }
      }
    </style>
