<svg width="92" height="112" viewBox="0 0 92 112" xmlns="http://www.w3.org/2000/svg"><style>.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar{transform-box:view-box}.body,.robe{transform-origin:46px 102px;animation:bodyBreathe 2.8s ease-in-out infinite}.head{transform-origin:46px 40px;animation:headNod 3.4s ease-in-out infinite}.hatHair{transform-origin:46px 28px;animation:hatSway 2.7s ease-in-out infinite}.staffArm,.staff{transform-origin:64px 62px;animation:staffIdle 2.4s ease-in-out infinite}.offArm{transform-origin:31px 61px;animation:offIdle 2.9s ease-in-out infinite}.capeScarf{transform-origin:44px 62px;animation:capeIdle 2s ease-in-out infinite}.familiar{transform-origin:20px 86px;animation:familiarBob 1.6s ease-in-out infinite}@keyframes bodyBreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1px) scale(1.015,.985)}}@keyframes headNod{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg) translateY(-.5px)}}@keyframes hatSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes staffIdle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes offIdle{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-3deg)}}@keyframes capeIdle{0%,100%{transform:skewX(-2deg)}50%{transform:skewX(3deg)}}@keyframes familiarBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(3deg)}}@media (prefers-reduced-motion: reduce){.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar{animation:none}}</style><ellipse cx="46" cy="106" rx="28" ry="5.5" fill="#000000" opacity="0.12"/><g class="familiar"><path d="M69 25L83 15L89 32L75 40Z" fill="#d8f4ff"/><path d="M74 26L85 31M82 18L76 37" stroke="#aa84da" stroke-width="2" stroke-linecap="round"/><path d="M75 40C70 49 72 56 76 63" stroke="#8b6a2c" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="capeScarf"><path d="M32 50C19 44 10 47 5 56C15 62 29 61 39 54Z" fill="#d85c