<svg width="160" height="140" viewBox="0 0 160 140" xmlns="http:&#47;&#47;www.w3.org/2000/svg">
  <defs>
    <style>
      .root {
        transform-origin: 78px 119px;
        animation: oniBounce 1.2s ease-in-out infinite;
      }
      .club {
        transform-origin: 112px 62px;
        animation: club 1.2s ease-in-out infinite;
      }
      .armL {
        transform-origin: 50px 76px;
      }
      .armR {
        transform-origin: 101px 72px;
        animation: arm 1.2s ease-in-out infinite;
      }
      @keyframes oniBounce {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-5px) rotate(2deg);
        }
      }
      @keyframes club {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(12deg);
        }
      }
      @keyframes arm {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-8deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .root,
        .club,
        .armR {
          animation: none;
        }
      }
    </style>
  </defs>
