<svg width="130" height="125" viewBox="0 0 130 125" xmlns="http:&#47;&#47;www.w3.org/2000/svg">
  <defs>
    <style>
      .root {
        transform-origin: 64px 104px;
        animation: ninjaCrouch 1.6s ease-in-out infinite;
      }
      .scarf {
        transform-origin: 72px 37px;
        animation: scarf 1.1s ease-in-out infinite;
      }
      .armR {
        transform-origin: 80px 67px;
        animation: armReady 1.6s ease-in-out infinite;
      }
      @keyframes ninjaCrouch {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-4px) rotate(2deg);
        }
      }
      @keyframes scarf {
        0%,
        100% {
          transform: rotate(-7deg);
        }
        50% {
          transform: rotate(10deg) translateX(5px);
        }
      }
      @keyframes armReady {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-8deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .root,
        .scarf,
        .armR {
          animation: none;
        }
      }
    </style>
  </defs>
