        transform-origin: 75px 118px;
        animation: samuraiReady 1.8s ease-in-out infinite;
      }
      .sword {
        transform-origin: 91px 76px;
        animation: swordReady 1.8s ease-in-out infinite;
      }
      .sodeL {
        transform-origin: 48px 69px;
      }
      .sodeR {
        transform-origin: 101px 69px;
        animation: sode 1.8s ease-in-out infinite;
      }
      @keyframes samuraiReady {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-3px) rotate(2deg);
        }
      }
      @keyframes swordReady {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-5deg);
        }
      }
      @keyframes sode {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(4deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .root,
        .sword,
        .sodeR {
          animation: none;
        }
      }
    </style>
