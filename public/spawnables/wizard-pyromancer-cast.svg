<svg width="92" height="112" viewBox="0 0 92 112" xmlns="http://www.w3.org/2000/svg"><style>.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{transform-box:view-box}.body,.robe{transform-origin:46px 101px;animation:pyroBody 1.2s ease-in-out infinite}.head{transform-origin:44px 47px;animation:pyroHead 1.2s ease-in-out infinite}.hatHair{transform-origin:44px 31px;animation:pyroHair 1.2s ease-in-out infinite}.staffArm,.staff{transform-origin:63px 62px;animation:pyroStaff 1.2s ease-in-out infinite}.offArm{transform-origin:31px 62px;animation:pyroOff 1.2s ease-in-out infinite}.capeScarf{transform-origin:43px 63px;animation:pyroCape 1.2s ease-in-out infinite}.robeHem{transform-origin:46px 92px;animation:pyroHem 1.2s ease-in-out infinite}.familiar{transform-origin:18px 94px;animation:pyroFam 1.2s ease-in-out infinite}.spark{transform-origin:48px 62px;animation:pyroSpark 1.2s ease-in-out infinite}@keyframes pyroBody{0%,100%{transform:translateY(0) scale(1)}22%{transform:translateY(8px) scale(1.12,.82)}50%{transform:translateX(6px) translateY(-6px) scale(.92,1.12) rotate(7deg)}72%{transform:translateX(-4px) rotate(-7deg)}}@keyframes pyroHead{0%,100%{transform:rotate(0)}22%{transform:translateY(7px) rotate(-12deg)}50%{transform:translateX(5px) translateY(-3px) rotate(16deg)}72%{transform:translateX(-3px) rotate(-12deg)}}@keyframes pyroHair{0%,100%{transform:rotate(0) scale(1)}22%{transform:translateY(5px) rotate(-13deg) scale(.9)}50%{transform:translate(5px,-5px) rotate(18deg) scale(1.2)}72%{transform:rotate(-16deg) scale(1.08)}}@keyframes pyroStaff{0%,100%{transform:rotate(0)}22%{transform:translate(-16px,9px) rotate(-70deg)}50%{transform:translate(15px,-9px) rotate(42deg)}72%{transform:translate(-6px,2px) rotate(-24deg)}}@keyframes pyroOff{0%,100%{transform:rotate(0)}22%{transform:translate(13px,8px) rotate(58deg)}50%{transform:translate(19px,-9px) rotate(-68deg)}72%{transform:translate(-8px,2px) rotate(34deg)}}@keyframes pyroCape{0%,100%{transform:skewX(0) translateX(0)}22%{transform:skewX(-12deg) translateY(3px)}50%{transform:skewX(24deg) translateX(-12px) translateY(-4px)}72%{transform:skewX(-18deg) translateX(3px)}}@keyframes pyroHem{0%,100%{transform:scaleX(1)}22%{transform:scaleX(1.15)}50%{transform:scaleX(1.45) translateY(-2px)}72%{transform:scaleX(.95)}}@keyframes pyroFam{0%,100%{transform:translateY(0)}22%{transform:translateY(3px) scale(1.05,.75)}50%{transform:translate(9px,-9px) rotate(21deg)}72%{transform:translate(-4px,1px) rotate(-12deg)}}@keyframes pyroSpark{0%,100%{opacity:.15;transform:scale(.2)}22%{opacity:.85;transform:translate(-8px,8px) scale(.65)}50%{opacity:1;transform:translate(18px,-10px) scale(1.35)}72%{opacity:.48;transform:translate(-6px,2px) scale(.55)}}@media (prefers-reduced-motion: reduce){.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{animation:none}}</style><ellipse cx="46" cy="106" rx="28" ry="5.5" fill="#000000" opacity="0.12"/><g class="familiar"><path d="M9 98C15 89 26 89 32 96C25 101 15 103 9 98Z" fill="#d7552d"/><path d="M28 94L38 89L34 99Z" fill="#f47a32"/><circle cx="17" cy="94" r="2" fill="#2a1d1d"/><path d="M11 101C7 103 6 107 6 110" stroke="#9b3a22" stroke-width="3" stroke-linecap="round" fill="none"/></g><g class="capeScarf"><path d="M28 57C15 62 11 78 20 96C33 92 43 77 41 58Z" fill="#8e2d24"/><path d="M23 76C20 80 20 85 22 90C27 86 30 81 32 75Z" fill="#ffd966" opacity="0.42"/></g><g class="staffArm staff"><path d="M61 61C72 64 78 75 76 88C70 91 61 83 58 72Z" fill="#7b4735"/><path d="M71 48L79 92" stroke="#3c3130" stroke-width="5" stroke-linecap="round"/><path d="M69 47L80 43L76 55Z" fill="#ffcf5a"/><circle cx="64" cy="62" r="4.5" fill="#42312e"/></g><g class="offArm"><path d="M34 63C23 65 16 74 15 86C23 90 35 80 39 68Z" fill="#7b4735"/><circle cx="22" cy="85" r="4.8" fill="#42312e"/></g><g class="body robe"><path d="M19 59C27 45 58 45 71 58C78 77 69 98 47 104C22 100 12 79 19 59Z" fill="#b63b2d"/><path d="M48 