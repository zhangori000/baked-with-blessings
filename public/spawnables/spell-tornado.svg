<svg width="104" height="116" viewBox="0 0 104 116" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="funnelFill" x1="12" x2="92" y1="58" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d8f4ff" stop-opacity="0.24"/><stop offset="0.46" stop-color="#96b2c9" stop-opacity="0.62"/><stop offset="0.58" stop-color="#6e879e" stop-opacity="0.74"/><stop offset="1" stop-color="#d8f4ff" stop-opacity="0.22"/></linearGradient><radialGradient id="baseDust" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#8b7355" stop-opacity="0.45"/><stop offset="1" stop-color="#8b7355" stop-opacity="0"/></radialGradient></defs><style>.funnel,.upper,.bands,.band,.shine,.base,.debris,.flake{transform-box:view-box}.funnel{transform-origin:52px 105px;animation:funnelBase 1.7s ease-in-out infinite}.upper{transform-origin:52px 86px;animation:funnelTop 1.7s ease-in-out infinite}.band{transform-origin:52px 103px;animation:bandRise 1.6s linear infinite}.b1{animation-delay:-1.4s}.b2{animation-delay:-1.2s}.b3{animation-delay:-1s}.b4{animation-delay:-.8s}.b5{animation-delay:-.6s}.b6{animation-delay:-.4s}.b7{animation-delay:-.2s}.b8{animation-delay:0s}.shine{transform-origin:52px 0;animation:shineSlide .8s ease-in-out infinite}.base{transform-origin:52px 106px;animation:basePulse .72s ease-in-out infinite alternate}.debris{transform-origin:52px 105px;animation:orbit 1s linear infinite}.flake{transform-origin:52px 60px;animation:snowFall 1.55s linear infinite}@keyframes funnelBase{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes funnelTop{0%,100%{transform:rotate(5deg) translateX(1px)}50%{transform:rotate(-6deg) translateX(-2px)}}@keyframes bandRise{0%{opacity:.08;transform:translateY(0) scaleX(.28)}10%{opacity:.78}100%{opacity:.08;transform:translateY(-88px) scaleX(4.2)}}@keyframes shineSlide{0%,100%{transform:translateX(-10px);opacity:.22}50%{transform:translateX(12px);opacity:.82}}@keyframes basePulse{from{transform:scaleX(.92)}to{transform:scaleX(1.1)}}@keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes snowFall{0%{opacity:0;transform:translateY(-24px) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(44px) rotate(180deg)}}@media (prefers-reduced-motion: reduce){.funnel,.upper,.bands,.band,.shine,.base,.debris,.flake{animation:none}}</style><ellipse cx="52" cy="108" rx="31" ry="6" fill="#4f412f" opacity="0.13"/><g class="funnel"><path d="M48 105C45 89 45 76 49 63C54 48 43 31 17 16C36 6 72 6 91 16C67 31 58 48 58 63C58 77 57 91 55 105Z" fill="url(#funnelFill)"/><path d="M50 104C50 84 51 70 53 57C56 40 50 28 40 14" stroke="#6e879e" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.18"/><g class="upper"><path d="M21 17C38 10 70 10 87 17C73 23 37 24 21 17Z" fill="#d8f4ff" opacity="0.24"/></g><g class="bands"><g class="band b1"><ellipse cx="52" cy="102" rx="8" ry="2.1" fill="#b8d9f0" opacity="0.72"/><ellipse class="shine" cx="49" cy="102" rx="3.4" ry=".7" fill="#f4fbff" opacity="0.84"/></g><g class="band b2"><ellipse cx="52" cy="102" rx="8" ry="2.1" fill="#b8d9f0" opacity="0.72"/><ellipse class="shine" cx="50" cy="102" rx="3.4" ry=".7" fill="#f4fbff" opacity="0.84"/></g><g class="band b3"><ellipse cx="52" cy="102" rx="8" ry="2.1" fill="#b8d9f0" opacity="0.72"/><ellipse class="shine" cx="53" cy="102" rx="3.4" ry=".7" fill="#f4fbff" opacity="0.84"/></g><g class="band b4"><ellipse cx="52" cy="102" rx="8" ry="2.1" fill="#b8d9f0" opacity="0.72"/><ellipse class="shine" cx="55" cy="102" rx="3.4" ry=".7" fill="#f4fbff" opacity="0.84"/></g><g class="band b5"><ellipse cx="52" cy="102" rx="8" ry="2.1" fill="#b8d9f0" opacity="0.72"/><ellipse class="shine" cx="51" cy="102" rx="3.4" ry=".7" fill="#f4fbff" opacity="0.84"/></g><g class="band b6"><ellipse cx="52" cy="102" rx="8" ry="2.1" fill="#b8d9f0" opacity="0.72"/><ellipse class="shine" cx="48" cy="102" rx="3.4" ry=".7" fill="#f4fbff" opacity="0.84"/></g><g class="band b7"><ellipse cx="52" cy="102" rx="8" ry="2.1" fill="#b8d