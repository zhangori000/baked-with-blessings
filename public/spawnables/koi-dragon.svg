<svg width="260" height="140" viewBox="0 0 260 140" xmlns="http:&#47;&#47;www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="17" y1="81" x2="228" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d8fa0" />
      <stop offset=".55" stop-color="#5fc9bd" />
      <stop offset="1" stop-color="#2f97ad" />
    </linearGradient>
    <style>
      .dragon {
        transform-origin: 130px 74px;
        animation: swim 2.4s ease-in-out infinite;
      }
      .finA {
        transform-origin: center;
        animation: finA 1.8s ease-in-out infinite;
      }
      .finB {
        transform-origin: center;
        animation: finB 2.2s ease-in-out infinite;
      }
      .whisker {
        transform-origin: 214px 60px;
        animation: whisk 2.2s ease-in-out infinite;
      }
      .glow {
        transform-origin: 122px 75px;
        animation: glow 1.9s ease-in-out infinite;
      }
      @keyframes swim {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-7px) rotate(2deg);
        }
      }
      @keyframes finA {
        0%,
        100% {
          transform: rotate(-4deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }
      @keyframes finB {
        0%,
        100% {
          transform: rotate(6deg);
        }
        50% {
          transform: rotate(-5deg);
        }
      }
      @keyframes whisk {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(5px);
        }
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.88) rotate(0);
        }
        50% {
          opacity: 0.55;
          transform: scale(1.08) rotate(18deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dragon,
        .finA,
        .finB,
        .whisker,
        .glow {
          animation: none;
        }
      }
    </style>
  </defs>
