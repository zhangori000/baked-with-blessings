<svg width="92" height="112" viewBox="0 0 92 112" xmlns="http://www.w3.org/2000/svg"><style>.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{transform-box:view-box}.body,.robe{transform-origin:46px 106px;animation:lightBody 1.42s ease-in-out infinite}.head{transform-origin:46px 30px;animation:lightHead 1.42s ease-in-out infinite}.hatHair{transform-origin:46px 20px;animation:lightCrown 1.42s ease-in-out infinite}.staffArm,.staff{transform-origin:61px 59px;animation:lightStaff 1.42s ease-in-out infinite}.offArm{transform-origin:32px 58px;animation:lightOff 1.42s ease-in-out infinite}.capeScarf{transform-origin:46px 63px;animation:lightRobe 1.42s ease-in-out infinite}.robeHem{transform-origin:46px 103px;animation:lightHem 1.42s ease-in-out infinite}.familiar{transform-origin:70px 34px;animation:lightLantern 1.42s ease-in-out infinite}.spark{transform-origin:70px 32px;animation:lightSpark 1.42s ease-in-out infinite}@keyframes lightBody{0%,100%{transform:translateY(0)}24%{transform:translateY(2px) rotate(-3deg)}52%{transform:translateY(-5px) scale(.94,1.06)}78%{transform:translateY(1px)}}@keyframes lightHead{0%,100%{transform:rotate(-2deg)}24%{transform:rotate(-10deg) translateY(1px)}52%{transform:rotate(6deg) translateY(-3px)}78%{transform:rotate(0)}}@keyframes lightCrown{0%,100%{transform:scale(1);opacity:1}24%{transform:translate(-4px,2px) scale(.92);opacity:.82}52%{transform:scale(1.2);opacity:1}78%{transform:scale(1.04)}}@keyframes lightStaff{0%,100%{transform:rotate(0)}24%{transform:translate(-8px,2px) rotate(-15deg)}52%{transform:translate(5px,-8px) rotate(16deg)}78%{transform:rotate(4deg)}}@keyframes lightOff{0%,100%{transform:rotate(0)}24%{transform:translate(9px,-10px) rotate(-82deg)}52%{transform:translate(-8px,-1px) rotate(42deg)}78%{transform:rotate(4deg)}}@keyframes lightRobe{0%,100%{transform:skewX(0)}52%{transform:skewX(7deg) translateY(-2px)}78%{transform:skewX(-3deg)}}@keyframes lightHem{0%,100%{transform:scaleX(1)}52%{transform:scaleX(1.25)}}@keyframes lightLantern{0%,100%{opacity:.8;transform:scale(.85)}24%{opacity:1;transform:scale(1.08)}52%{opacity:1;transform:scale(1.3)}78%{opacity:.9;transform:scale(.95)}}@keyframes lightSpark{0%,100%{opacity:.2;transform:scale(.35)}24%{opacity:.9;transform:scale(.85)}52%{opacity:1;transform:scale(1.38)}78%{opacity:.45;transform:scale(.65)}}@media (prefers-reduced-motion: reduce){.body,.robe,.robeHem,.head,.hatHair,.staffArm,.offArm,.staff,.capeScarf,.familiar,.spark{animation:none}}</style><ellipse cx="46" cy="106" rx="28" ry="5.5" fill="#000000" opacity="0.12"/><g class="capeScarf"><path d="M28 38C20 65 21 93 39 106C50 110 64 102 72 91C68 67 61 49 55 37Z" fill="#fff7d7"/><path d="M37 50C41 68 44 86 46 106C52 87 58 70 66 51C58 42 46 42 37 50Z" fill="#e8c86f" opacity="0.55"/></g><g class="staffArm staff"><path d="M58 59C68 61 77 69 80 82C73 87 62 79 58 66Z" fill="#d9a56e"/><path d="M70 35L76 104" stroke="#8b6a2c" stroke-width="4" stroke-linecap="round"/><g class="familiar"><path d="M65 22H83L79 38H69Z" fill="#e7b74f"/><path d="M69 23C70 15 78 15 80 23Z" fill="#ffd966"/><circle cx="74" cy="29" r="6.5" fill="#fff6c8" opacity="0.88"/></g></g><g class="offArm"><path d="M34 58C25 61 18 70 15 83C22 88 34 78 39 65Z" fill="#d9a56e"/><circle cx="20" cy="80" r="3.8" fill="#c98662"/><path d="M20 77C24 74 29 75 33 79" stroke="#fff7d7" stroke-width="6" stroke-linecap="round" fill="none"/></g><g class="body robe"><path d="M30 36C35 23 55 23 62 36C72 64 68 94 47 106C26 96 19 64 30 36Z" fill="#f2d27b"/><path d="M47 29C59 49 61 81 54 101C60 92 65 65 60 40C57 33 52 29 47 29Z" fill="#d7a945" opacity="0.55"/><path d="M34 55C43 62 52 62 61 55M37 72C43 77 52 77 58 71" stroke="#fff6c8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.82"/><g class="robeHem"><path d="M25 94C38 104 58 104 70 93C64 102 55 108 47 109C37 108 30 102 25 94Z" fill="#fff7d7"/></g></g><path d="M37 101Q31 108 23 111" stroke="#8b6a2c" stroke-width="5" stroke-linecap="round