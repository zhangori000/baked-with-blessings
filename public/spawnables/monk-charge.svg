<svg width="130" height="140" viewBox="0 0 130 140" xmlns="http:&#47;&#47;www.w3.org/2000/svg">
  <defs>
    <style>
      .body {
        transform-origin: 64px 116px;
        animation: monkBreath 2.3s ease-in-out infinite;
      }
      .head {
        transform-origin: 64px 41px;
        animation: monkHead 2.3s ease-in-out infinite;
      }
      .beads {
        transform-origin: 64px 70px;
        animation: beads 2.3s ease-in-out infinite;
      }
      .aura {
        transform-origin: 65px 70px;
        animation: aura 1.8s ease-in-out infinite;
      }
      .ki {
        transform-origin: 92px 54px;
        animation: ki 1.1s ease-in-out infinite;
      }
      @keyframes monkBreath {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @keyframes monkHead {
        0%,
        100% {
          transform: rotate(-1deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }
      @keyframes beads {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(3px);
        }
      }
      @keyframes aura {
        0%,
        100% {
          opacity: 0.18;
          transform: scale(0.92);
        }
        50% {
          opacity: 0.42;
          transform: scale(1.08);
        }
      }
      @keyframes ki {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .body,
        .head,
        .beads,
        .aura,
        .ki {
          animation: none;
        }
      }
    </style>
  </defs>
  <ellipse cx="64" cy="132" rx="35" ry="5" fill="#2d2433" opacity=".1" />
